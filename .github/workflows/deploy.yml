name: Deploy Questions

on:
  push:
    branches:
      - main
      
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  call-workflow:
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: gurukulams/workshop/.github/workflows/build-question-repo.yml@main
    secrets: inherit
  steps:
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: call-workflow

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4