name: Deploy Questions

on:
  push:
    branches:
      - main

jobs:
  call-workflow:
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: gurukulams/workshop/.github/workflows/build-question-repo.yml@main
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: call-workflow

    steps:
      - name: Deploy
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.QUESTION_REPO_HOST }}
          username: ${{ secrets.QUESTION_REPO_USER }}
          key: ${{ secrets.QUESTION_REPO_KEY }}
          target: ${{ secrets.QUESTION_REPO_WORKSHOP_ROOT }}
          source: "design-system/dist/*"
          strip_components: 2